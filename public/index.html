<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MaisonFlix</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="logo">Maison<span>Flix</span></div>
  <nav><button class="active" data-filter="all">Accueil</button><button data-filter="movie">Films</button><button data-filter="series">Séries</button></nav>
  <input id="search" placeholder="Rechercher...">
</header>
<main>
  <section class="hero">
    <div>
      <p class="eyebrow">SERVEUR MAISON</p>
      <h1>Votre cinéma,<br>chez vous.</h1>
      <p>Films et séries stockés sur votre serveur, accessibles depuis votre réseau local.</p>
      <button id="browse">Voir la bibliothèque</button>
    </div>
  </section>
  <section>
    <h2 id="sectionTitle">Votre bibliothèque</h2>
    <div id="grid" class="grid"></div>
    <p id="empty" class="empty" hidden>Aucune vidéo trouvée.</p>
  </section>
</main>
<div id="player" class="player" hidden>
  <button id="close">✕</button>
  <video id="video" controls autoplay></video>
  <h2 id="playerTitle"></h2>
</div>
<script src="/app.js"></script>
</body>
</html>
